name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      extended_label:
        description: Optional stress or soak CTest label
        required: false
        type: choice
        options:
          - fast
          - stress
          - soak
        default: fast

jobs:
  linux:
    name: Linux / ${{ matrix.preset }} / ${{ matrix.compiler }} / ${{ matrix.queue }} / stealing=${{ matrix.stealing }} / ${{ matrix.parking }}-${{ matrix.event_backend }}
    runs-on: ubuntu-latest
    # GCC -Wtsan diagnoses atomic_thread_fence as unsupported. Keep -Werror
    # and the real fences; use Clang for this sanitizer job.
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: release
            compiler: g++
            queue: mutex
            stealing: "OFF"
            parking: cv
            event_backend: auto
          - preset: tsan
            compiler: clang++
            queue: mutex
            stealing: "OFF"
            parking: cv
            event_backend: auto
          - preset: asan-ubsan
            compiler: g++
            queue: mutex
            stealing: "OFF"
            parking: cv
            event_backend: auto
          - preset: release
            compiler: clang++
            queue: mutex
            stealing: "OFF"
            parking: cv
            event_backend: auto
          - preset: release
            compiler: g++
            queue: mpmc
            stealing: "OFF"
            parking: cv
            event_backend: auto
          - preset: tsan
            compiler: clang++
            queue: mpmc
            stealing: "OFF"
            parking: cv
            event_backend: auto
          - preset: asan-ubsan
            compiler: g++
            queue: mpmc
            stealing: "OFF"
            parking: cv
            event_backend: auto
          - preset: release
            compiler: clang++
            queue: mpmc
            stealing: "OFF"
            parking: cv
            event_backend: auto
          - preset: release
            compiler: g++
            queue: mpmc
            stealing: "ON"
            parking: cv
            event_backend: auto
          - preset: tsan
            compiler: clang++
            queue: mpmc
            stealing: "ON"
            parking: cv
            event_backend: auto
          - preset: asan-ubsan
            compiler: g++
            queue: mpmc
            stealing: "ON"
            parking: cv
            event_backend: auto
          - preset: release
            compiler: clang++
            queue: mpmc
            stealing: "ON"
            parking: cv
            event_backend: auto
          - preset: release
            compiler: g++
            queue: mpmc
            stealing: "ON"
            parking: eventcount
            event_backend: futex
          - preset: tsan
            compiler: clang++
            queue: mpmc
            stealing: "ON"
            parking: eventcount
            event_backend: futex
          - preset: asan-ubsan
            compiler: g++
            queue: mpmc
            stealing: "ON"
            parking: eventcount
            event_backend: futex
          - preset: release
            compiler: clang++
            queue: mpmc
            stealing: "ON"
            parking: eventcount
            event_backend: futex
          - preset: release
            compiler: g++
            queue: mpmc
            stealing: "ON"
            parking: eventcount
            event_backend: generic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Configure
        run: cmake --preset "${{ matrix.preset }}" -DCMAKE_CXX_COMPILER="${{ matrix.compiler }}" -DMAGPIE_BUILD_BENCHMARKS=ON -DMAGPIE_QUEUE_BACKEND="${{ matrix.queue }}" -DMAGPIE_ENABLE_WORK_STEALING="${{ matrix.stealing }}" -DMAGPIE_PARKING_BACKEND="${{ matrix.parking }}" -DMAGPIE_EVENTCOUNT_BACKEND="${{ matrix.event_backend }}"
      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}" --parallel 2
      - name: Run fast tests
        run: python3 scripts/run_ctest.py --build-dir "build/${{ matrix.preset }}" --mode fast
      - name: Benchmark harness smoke (no performance claim)
        if: matrix.preset == 'release'
        run: python3 scripts/run_benchmarks.py suite --binary "build/${{ matrix.preset }}/bench/magpie_bench" --repeat 1 --smoke --output "build/${{ matrix.preset }}/benchmark-smoke"

  macos:
    name: macOS / Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Configure
        run: cmake --preset release -DMAGPIE_BUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build --preset release --parallel 2
      - name: Run fast tests
        run: python3 scripts/run_ctest.py --build-dir build/release --mode fast

  extended-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.extended_label != 'fast'
    name: Linux / ${{ inputs.extended_label }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Configure release
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --parallel 2
      - name: Run selected test label
        run: python3 scripts/run_ctest.py --build-dir build/release --mode "${{ inputs.extended_label }}"
